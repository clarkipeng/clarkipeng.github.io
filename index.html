<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Clark Peng" />
  <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
  <!--seo-->
  <title>Clark Peng | CS at UCLA</title>
  <!--/seo-->

  <!-- Apply the saved theme before first paint -->
  <script>
    document.documentElement.classList.add('js');
    try {
      var theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>

  <!-- Google Fonts: Inter, and Caveat for the desk's notes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Single Page Apps for GitHub Pages redirect script -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
